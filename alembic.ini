# Alembic configuration file for DATA-SERVICE 2.0
# Database URL is intentionally left blank here — it is injected at runtime
# from the DATABASE_URL environment variable inside alembic/env.py.
# Never commit credentials to this file (Requirement 19.1).

[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template for migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# sys.path entry for Python imports — adds project root so `src.*` is importable.
prepend_sys_path = .

# Timezone for file timestamps in migration file names.
timezone = UTC

# Maximum character length of the "slug" portion of migration filenames.
truncate_slug_length = 40

# The SQLAlchemy URL is populated dynamically in env.py from DATABASE_URL.
# Do NOT set sqlalchemy.url here — it would be ignored by the async runner.
# sqlalchemy.url =

[post_write_hooks]
# Optional: run ruff format on newly-generated migration files.
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
