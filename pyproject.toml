[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-service"
version = "2.0.0"
description = "DATA-SERVICE 2.0 — standalone, production-grade Market Data Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AlphaForge Engineering" }]

dependencies = [
    # HTTP framework
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",

    # Schema / validation (Pydantic v2 — no v1 shims)
    "pydantic[email]==2.13.5",
    "pydantic-settings==2.15.0",

    # Async HTTP (outbound provider calls)
    "httpx==0.28.1",
    "aiohttp==3.14.3",

    # NSE WAF bypass
    "curl-cffi==0.16.3",
    "scrapling==0.4.15",

    # Redis client (async + hiredis C parser)
    "redis[hiredis]==8.1.0",

    # PostgreSQL async driver
    "asyncpg==0.31.0",

    # ORM / query builder (async)
    "sqlalchemy[asyncio]==2.0.52",

    # DB migrations
    "alembic==1.20.0",

    # Structured logging
    "structlog==26.1.0",

    # OpenTelemetry — pinned to actual latest stable
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",

    # Prometheus metrics
    "prometheus-client==0.26.0",
    "prometheus-fastapi-instrumentator==8.1.0",

    # Task scheduling
    "apscheduler==3.11.3",

    # Bulk in-process OHLCV transforms (not pandas)
    "polars==1.44.2",
    "pyarrow==25.0.1",

    # WebSocket client (Binance WS)
    "websockets==17.1",

    # Protobuf (Upstox V3)
    "protobuf==7.36.1",

    # TOTP (Angel One)
    "pyotp==2.10.0",

    # NTP clock skew
    "ntplib==0.4.0",

    # JWT authentication (consumer API key + bearer token)
    "PyJWT==2.13.0",

    # Utilities
    "python-multipart==0.0.32",
    "orjson==3.12.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "anyio[trio]==4.9.0",
    "httpx==0.28.1",  # also used as async test client

    # Property-based testing
    "hypothesis==6.168.0",

    # Type checking
    "mypy==2.3.1",

    # Linting / formatting
    "ruff==0.16.7",

    # Load testing
    "locust==2.46.5",
]

[project.scripts]
data-service-api = "src.server:main"
data-service-worker = "src.worker:main"
data-service-scheduler = "src.scheduler:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-q",
]
markers = [
    "integration: marks tests requiring live Redis and PostgreSQL (deselect with -m 'not integration')",
    "performance: marks load/benchmark tests",
    "property: marks Hypothesis property-based tests",
]

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.isort]
known-first-party = ["src"]
